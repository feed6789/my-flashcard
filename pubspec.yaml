name: flashcard_app
description: A multi-language flashcard application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.3
  
  # Supabase
  supabase_flutter: ^2.17.2
  
  # Local Storage
  shared_preferences: ^2.5.5
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  
  # File & Excel
  file_picker: ^8.0.0
  excel: ^4.0.6
  
  # UI Components
  flip_card: ^0.7.0
  flutter_card_swiper: ^7.2.0
  
  # Audio
  flutter_tts: ^4.2.5
  audioplayers: ^6.7.1
  
  # Utilities
  intl: ^0.18.1
  path_provider: ^2.1.1
  path: ^1.8.0
  sqflite: ^2.4.2+1
  sqflite_common_ffi: ^2.4.0+3
  google_fonts: ^8.2.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.5.4
  riverpod_generator: ^2.3.10

flutter:
  uses-material-design: true